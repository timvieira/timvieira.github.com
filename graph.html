<style>
  :root {
    --bg:#f6f1ea;--ink:#2c2520;--ink-light:#5c534a;--ink-faint:#8a8078;

    --font-mono:'Source Code Pro','Menlo',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-serif);overflow:hidden;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;

    pointer-events:none;z-index:0;}
  #graph-container{width:100vw;height:100vh;position:relative;cursor:grab;z-index:1;}
  #graph-container:active{cursor:grabbing;}
  svg{width:100%;height:100%;}

  .header{position:fixed;top:0;left:0;right:0;padding:0.9rem 1.5rem;
    display:flex;align-items:baseline;gap:1.5rem;z-index:10;
    background:linear-gradient(to bottom,var(--bg) 60%,transparent);pointer-events:none;}
  .header>*{pointer-events:auto;}
  .header h1{font-family:var(--font-serif);font-size:1.4rem;font-weight:700;color:var(--ink);}
  .header nav{display:flex;gap:1.2rem;}
  .header nav a{font-family:var(--font-serif);font-size:0.85rem;font-weight:500;
    color:var(--link);text-decoration:none;border-bottom:1px solid rgba(139,74,58,0.25);transition:all 0.2s;}
  .header nav a:hover{border-bottom-color:var(--link);}

  .legend{position:fixed;bottom:0.8rem;left:1rem;right:1rem;
    display:flex;flex-wrap:wrap;justify-content:center;
    gap:0.3rem 1rem;z-index:10;pointer-events:auto;
    background:linear-gradient(to top,var(--bg) 60%,transparent);
    padding:0.6rem 0 0.2rem;}
  .legend-item{display:flex;align-items:center;gap:0.3rem;font-family:var(--font-serif);
    font-size:0.72rem;color:var(--ink-light);cursor:pointer;transition:opacity 0.3s;user-select:none;}
  .legend-item.dimmed{opacity:0.15;}
  .legend-dot{width:8px;height:8px;border-radius:50%;border:1px solid rgba(44,37,32,0.1);}

  .filter-hint{position:fixed;top:3.2rem;left:50%;transform:translateX(-50%);
    font-family:var(--font-serif);font-size:0.8rem;color:var(--ink-faint);z-index:10;
    opacity:0;transition:opacity 0.3s;pointer-events:none;}
  .filter-hint.visible{opacity:1;}

  .tooltip{position:fixed;pointer-events:none;z-index:20;
    background:rgba(255,252,247,0.97);border:1px solid var(--border);
    border-radius:4px;padding:0.65rem 0.85rem;max-width:380px;opacity:0;
    transition:opacity 0.15s;box-shadow:0 4px 20px rgba(44,37,32,0.1);}
  .tooltip.visible{opacity:1;}
  .tooltip-kind{font-family:var(--font-mono);font-size:0.6rem;text-transform:uppercase;
    letter-spacing:0.1em;margin-bottom:0.3em;opacity:0.5;}
  .tooltip-title{font-family:var(--font-serif);font-size:0.9rem;font-weight:600;
    color:var(--ink);margin-bottom:0.15em;line-height:1.3;}
  .tooltip-meta{font-size:0.72rem;color:var(--ink-faint);margin-bottom:0.15em;line-height:1.3;}
  .tooltip-venue{font-family:var(--font-mono);font-size:0.68rem;color:var(--ink-light);font-weight:500;}
  .tooltip-award{display:inline-block;font-size:0.66rem;color:#8b6914;
    background:rgba(139,105,20,0.08);padding:0.05em 0.3em;border-radius:2px;margin-left:0.3em;}
  .tooltip-themes{margin-top:0.25em;display:flex;gap:0.2rem;flex-wrap:wrap;}
  .tooltip-theme{font-family:var(--font-mono);font-size:0.58rem;padding:0.1em 0.3em;
    border-radius:2px;color:white;opacity:0.8;}

  .zone-label{font-family:var(--font-serif);font-size:0.75rem;font-weight:600;
    letter-spacing:0.15em;text-transform:uppercase;fill:var(--ink-faint);opacity:0.25;
    pointer-events:none;}

  .instructions{position:fixed;top:3rem;right:1.5rem;font-family:var(--font-serif);
    font-size:0.72rem;color:var(--ink-faint);text-align:right;line-height:1.5;z-index:10;}

  @media(max-width:700px){
    .instructions{display:none;}
    .legend{gap:0.2rem 0.6rem;}
    .legend-item{font-size:0.65rem;}
    .header{padding:0.7rem 0.8rem;gap:0.8rem;}
    .header h1{font-size:1.1rem;}
  }
</style>

  {id:'b-dim-analysis-16',title:'Dimensional analysis of gradient ascent',
   year:2016,tags:'optimization, calculus',url:'https://timvieira.github.io/blog/post/2016/05/27/dimensional-analysis-of-gradient-ascent/',themes:['optimization']},
  {id:'b-hyper-16',title:'Gradient-based hyperparameter optimization',
   year:2016,tags:'calculus, hyperparameter-optimization',url:'https://timvieira.github.io/blog/post/2016/03/05/gradient-based-hyperparameter-optimization-and-the-implicit-function-theorem/',themes:['optimization','autodiff']},
  {id:'b-array-16',title:'Multidimensional array index',
   year:2016,tags:'datastructures',url:'https://timvieira.github.io/blog/post/2016/01/17/multidimensional-array-index/',themes:['numerical']},

  // 2015
  {id:'b-grad-product-15',title:'Gradient of a product',
   year:2015,tags:'calculus, automatic-differentiation',url:'https://timvieira.github.io/blog/post/2015/07/29/gradient-of-a-product/',themes:['autodiff','numerical']},
  {id:'b-crf-same-15',title:'Multiclass logistic regression and CRFs are the same thing',
   year:2015,tags:'machine-learning, crf',url:'https://timvieira.github.io/blog/post/2015/04/29/multiclass-logistic-regression-and-conditional-random-fields-are-the-same-thing/',themes:['ml','parsing']},
  {id:'b-crf-deep-15',title:'Conditional random fields as deep learning models?',
   year:2015,tags:'machine-learning, structured-prediction',url:'https://timvieira.github.io/blog/post/2015/02/05/conditional-random-fields-as-deep-learning-models/',themes:['ml','parsing']},
  {id:'b-logreal-15',title:'Log-Real number class',
   year:2015,tags:'numerical, datastructures',url:'https://timvieira.github.io/blog/post/2015/02/01/log-real-number-class/',themes:['numerical']},

  // 2014
  {id:'b-is-14',title:'Importance sampling',
   year:2014,tags:'statistics, importance-sampling',url:'https://timvieira.github.io/blog/post/2014/12/21/importance-sampling/',themes:['sampling','generation']},
  {id:'b-pnorms-14',title:'Numerically stable p-norms',
   year:2014,tags:'numerical',url:'https://timvieira.github.io/blog/post/2014/11/10/numerically-stable-p-norms/',themes:['numerical']},
  {id:'b-kl-14',title:'KL-divergence as an objective function',
   year:2014,tags:'statistics, machine-learning',url:'https://timvieira.github.io/blog/post/2014/10/06/kl-divergence-as-an-objective-function/',themes:['ml','generation']},
  {id:'b-complex-14',title:'Complex-step derivative',
   year:2014,tags:'calculus, numerical',url:'https://timvieira.github.io/blog/post/2014/08/07/complex-step-derivative/',themes:['autodiff','numerical']},
  {id:'b-gumbel-reservoir-14',title:'Gumbel-max trick and weighted reservoir sampling',
   year:2014,tags:'sampling, Gumbel, reservoir-sampling',url:'https://timvieira.github.io/blog/post/2014/08/01/gumbel-max-trick-and-weighted-reservoir-sampling/',themes:['sampling','beam']},
  {id:'b-gumbel-14',title:'Gumbel-max trick',
   year:2014,tags:'sampling, Gumbel',url:'https://timvieira.github.io/blog/post/2014/07/31/gumbel-max-trick/',themes:['sampling','beam']},
  {id:'b-grid-14',title:'Rant against grid search',
   year:2014,tags:'hyperparameter-optimization',url:'https://timvieira.github.io/blog/post/2014/07/22/rant-against-grid-search/',themes:['optimization']},
  {id:'b-delta-14',title:'Expected value of a quadratic and the Delta method',
   year:2014,tags:'statistics',url:'https://timvieira.github.io/blog/post/2014/07/21/expected-value-of-a-quadratic-and-the-delta-method/',themes:['numerical']},
  {id:'b-viz-14',title:'Visualizing high-dimensional functions with cross-sections',
   year:2014,tags:'visualization',url:'https://timvieira.github.io/blog/post/2014/02/12/visualizing-high-dimensional-functions-with-cross-sections/',themes:['optimization']},
  {id:'b-expnorm-14',title:'Exp-normalize trick',
   year:2014,tags:'numerical',url:'https://timvieira.github.io/blog/post/2014/02/11/exp-normalize-trick/',themes:['numerical']},
  {id:'b-gvp-14',title:'Gradient-vector product',
   year:2014,tags:'calculus',url:'https://timvieira.github.io/blog/post/2014/02/10/gradient-vector-product/',themes:['autodiff']},
];

// Mark types
papers.forEach(p => { p.kind = 'paper'; });
blogs.forEach(b => { b.kind = 'blog'; b.authors = ''; b.venue = b.tags; });
const allNodes = [...papers, ...blogs];

// ═══════════════════════════════════════════════
// Build edges — same themes = connection
// ═══════════════════════════════════════════════
const edges = [];
for (let i = 0; i < allNodes.length; i++) {
  for (let j = i + 1; j < allNodes.length; j++) {
    const a = allNodes[i], b = allNodes[j];
    const shared = a.themes.filter(t => b.themes.includes(t));
    if (shared.length === 0) continue;

    const sameKind = a.kind === b.kind;
    const yearDist = Math.abs(a.year - b.year);
    let yearBoost = yearDist <= 1 ? 1.5 : yearDist <= 2 ? 1.1 : yearDist <= 4 ? 0.7 : 0.35;

    // Cross-type edges are weaker but still present
    const crossFactor = sameKind ? 1.0 : 0.7;
    const strength = shared.length * yearBoost * crossFactor;

    // Higher threshold to avoid too many edges with 77 nodes
    const threshold = sameKind ? 0.4 : 0.55;
    if (strength >= threshold) {
      edges.push({
        source: a.id, target: b.id, shared, strength,
        crossType: !sameKind,
      });
    }
  }
}

// ═══════════════════════════════════════════════
// D3 layout
// ═══════════════════════════════════════════════
const W = window.innerWidth, H = window.innerHeight;
const svg = d3.select('#graph-container').append('svg').attr('viewBox', [0, 0, W, H]);
const g = svg.append('g');

const zoom = d3.zoom().scaleExtent([0.2, 5]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

// Barrier: papers left, blogs right
const MID = W / 2;
const BARRIER_STRENGTH = 0.055;

function nodeR(d) {
  const minY = 2009, maxY = 2025;
  const recency = (d.year - minY) / (maxY - minY);
  const base = d.kind === 'paper' ? 4 : 3;
  const scale = d.kind === 'paper' ? 8 : 6;
  return base + recency * scale + (d.award ? 3 : 0);
}
function nodeColor(d) { return THEMES[d.themes[0]].color; }

const simulation = d3.forceSimulation(allNodes)
  .force('link', d3.forceLink(edges).id(d => d.id)
    .distance(d => (d.crossType ? 120 : 65) / Math.sqrt(d.strength))
    .strength(d => Math.min(0.4, d.strength * (d.crossType ? 0.025 : 0.05))))
  .force('charge', d3.forceManyBody().strength(-110))
  .force('center', d3.forceCenter(W / 2, H / 2).strength(0.01))
  .force('collision', d3.forceCollide().radius(d => nodeR(d) + 5))
  .force('y', d3.forceY(H / 2).strength(0.025))
  // Segregation force: papers left, blogs right
  .force('x', d3.forceX(d => d.kind === 'paper' ? MID * 0.55 : MID * 1.45).strength(BARRIER_STRENGTH));

// ── Zone labels ──
g.append('text').attr('class', 'zone-label')
  .attr('x', W * 0.22).attr('y', 50).attr('text-anchor', 'middle')
  .text('PUBLICATIONS');
g.append('text').attr('class', 'zone-label')
  .attr('x', W * 0.78).attr('y', 50).attr('text-anchor', 'middle')
  .text('BLOG · GRADUATE DESCENT');

// ── Barrier line ──
g.append('line')
  .attr('x1', MID).attr('y1', 30).attr('x2', MID).attr('y2', H - 30)
  .attr('stroke', '#2c2520').attr('stroke-opacity', 0.06)
  .attr('stroke-width', 1).attr('stroke-dasharray', '6,6');

// ── Edges ──
const link = g.append('g').selectAll('line').data(edges).join('line')
  .attr('stroke', d => THEMES[d.shared[0]].color)
  .attr('stroke-opacity', d => d.crossType ? 0.07 + d.strength * 0.015 : 0.05 + d.strength * 0.025)
  .attr('stroke-width', d => d.crossType ? 0.5 + d.strength * 0.25 : 0.35 + d.strength * 0.3)
  .attr('stroke-dasharray', d => d.crossType ? '3,3' : null);

// ── Nodes ──
const node = g.append('g').selectAll('g').data(allNodes).join('g')
  .attr('cursor', 'pointer')
  .call(d3.drag().on('start', ds).on('drag', dd).on('end', de));

// Paper = circle, Blog = rounded square
node.each(function(d) {
  const el = d3.select(this);
  if (d.kind === 'paper') {
    el.append('circle')
      .attr('r', nodeR(d))
      .attr('fill', nodeColor(d))
      .attr('fill-opacity', 0.75)
      .attr('stroke', nodeColor(d))
      .attr('stroke-opacity', 0.3)
      .attr('stroke-width', 1.5);
  } else {
    const r = nodeR(d);
    el.append('rect')
      .attr('x', -r).attr('y', -r)
      .attr('width', r * 2).attr('height', r * 2)
      .attr('rx', 3).attr('ry', 3)
      .attr('fill', nodeColor(d))
      .attr('fill-opacity', 0.65)
      .attr('stroke', nodeColor(d))
      .attr('stroke-opacity', 0.25)
      .attr('stroke-width', 1.2);
  }
});

// Award rings (papers only)
node.filter(d => d.award).append('circle')
  .attr('r', d => nodeR(d) + 3)
  .attr('fill', 'none')
  .attr('stroke', '#9a7b3c')
  .attr('stroke-width', 1.5)
  .attr('stroke-dasharray', '3,2')
  .attr('stroke-opacity', 0.6);

// Year labels
node.append('text')
  .text(d => "'" + String(d.year).slice(2))
  .attr('font-family', "'Source Code Pro',monospace")
  .attr('font-size', d => Math.max(6, nodeR(d) * 0.6) + 'px')
  .attr('fill', 'white').attr('fill-opacity', 0.9)
  .attr('text-anchor', 'middle').attr('dy', '0.35em')
  .attr('pointer-events', 'none');

// Short title labels
node.append('text')
  .text(d => {
    const t = d.title;
    if (t.length <= 24) return t;
    const w = t.split(/\s+/); let l = '';
    for (const x of w) { if (l.length > 22) break; l += (l ? ' ' : '') + x; }
    return l + '…';
  })
  .attr('font-family', "'Crimson Pro',serif")
  .attr('font-size', d => d.kind === 'paper' ? '8px' : '7.5px')
  .attr('font-style', d => d.kind === 'blog' ? 'italic' : 'normal')
  .attr('fill', d => nodeColor(d))
  .attr('fill-opacity', 0.55)
  .attr('text-anchor', 'middle')
  .attr('dy', d => nodeR(d) + 11)
  .attr('pointer-events', 'none');

// ═══════════════════════════════════════════════
// Tooltip
// ═══════════════════════════════════════════════
const tooltip = document.getElementById('tooltip');
const ttKind = document.getElementById('tt-kind');
const ttT = document.getElementById('tt-title');
const ttM = document.getElementById('tt-meta');
const ttV = document.getElementById('tt-venue');
const ttTh = document.getElementById('tt-themes');
let activeFilter = null;

node.on('mouseenter', (e, d) => {
  ttKind.textContent = d.kind === 'paper' ? '📄 Publication' : '✏️ Blog Post';
  ttT.textContent = d.title;
  ttM.textContent = d.authors || '';
  let vh = d.venue || '';
  if (d.award) vh += ` <span class="tooltip-award">🏆 ${d.award}</span>`;
  ttV.innerHTML = vh;
  ttTh.innerHTML = d.themes.map(t =>
    `<span class="tooltip-theme" style="background:${THEMES[t].color}">${THEMES[t].label}</span>`
  ).join('');
  tooltip.classList.add('visible');

  // Highlight connected
  const connected = new Set([d.id]);
  edges.forEach(l => {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    if (s === d.id) connected.add(t);
    if (t === d.id) connected.add(s);
  });
  node.selectAll('circle, rect').transition().duration(200)
    .attr('fill-opacity', n => connected.has(n.id) ? 0.9 : 0.08)
    .attr('stroke-opacity', n => connected.has(n.id) ? 0.5 : 0.02);
  node.selectAll('text').transition().duration(200)
    .attr('fill-opacity', n => connected.has(n.id) ? 0.9 : 0.06);
  link.transition().duration(200)
    .attr('stroke-opacity', l => {
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      return (s === d.id || t === d.id) ? 0.4 + l.strength * 0.1 : 0.01;
    })
    .attr('stroke-width', l => {
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      return (s === d.id || t === d.id) ? 1.2 + l.strength * 0.6 : 0.15;
    });
})
.on('mousemove', e => {
  tooltip.style.left = Math.min(e.clientX + 15, window.innerWidth - 400) + 'px';
  tooltip.style.top = Math.min(e.clientY - 10, window.innerHeight - 200) + 'px';
})
.on('mouseleave', () => { tooltip.classList.remove('visible'); resetHL(); })
.on('click', (e, d) => { if (d.url) window.open(d.url, '_blank'); });

function resetHL() {
  if (activeFilter) return;
  node.selectAll('circle, rect').transition().duration(300)
    .attr('fill-opacity', d => d.kind === 'paper' ? 0.75 : 0.65)
    .attr('stroke-opacity', d => d.kind === 'paper' ? 0.3 : 0.25);
  node.selectAll('text').transition().duration(300)
    .attr('fill-opacity', (d, i, nodes) => {
      const fs = d3.select(nodes[i]).attr('font-size');
      return (fs === '8px' || fs === '7.5px') ? 0.55 : 0.9;
    });
  link.transition().duration(300)
    .attr('stroke-opacity', d => d.crossType ? 0.07 + d.strength * 0.015 : 0.05 + d.strength * 0.025)
    .attr('stroke-width', d => d.crossType ? 0.5 + d.strength * 0.25 : 0.35 + d.strength * 0.3);
}

// ═══════════════════════════════════════════════
// Legend
// ═══════════════════════════════════════════════
const legendEl = document.getElementById('legend');
const filterHint = document.getElementById('filter-hint');

// Shape legend first
const shapeLeg = document.createElement('div');
shapeLeg.style.cssText = 'display:flex;gap:0.8rem;margin-right:0.5rem;padding-right:0.8rem;border-right:1px solid rgba(44,37,32,0.12);';
shapeLeg.innerHTML = `
  <span style="font-family:var(--font-serif);font-size:0.72rem;color:var(--ink-faint);display:flex;align-items:center;gap:0.25rem;">
    <svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="var(--ink-faint)" opacity="0.4"/></svg> paper
  </span>
  <span style="font-family:var(--font-serif);font-size:0.72rem;color:var(--ink-faint);display:flex;align-items:center;gap:0.25rem;">
    <svg width="10" height="10"><rect x="1" y="1" width="8" height="8" rx="2" fill="var(--ink-faint)" opacity="0.4"/></svg> blog
  </span>`;
legendEl.appendChild(shapeLeg);

for (const [key, theme] of Object.entries(THEMES)) {
  if (!allNodes.some(n => n.themes.includes(key))) continue;
  const pc = papers.filter(p => p.themes.includes(key)).length;
  const bc = blogs.filter(b => b.themes.includes(key)).length;
  const counts = [pc ? `${pc}p` : '', bc ? `${bc}b` : ''].filter(Boolean).join('+');
  const item = document.createElement('div');
  item.className = 'legend-item'; item.dataset.theme = key;
  item.innerHTML = `<div class="legend-dot" style="background:${theme.color}"></div>${theme.label} <span style="opacity:0.5">(${counts})</span>`;
  item.addEventListener('click', () => {
    if (activeFilter === key) {
      activeFilter = null;
      document.querySelectorAll('.legend-item').forEach(el => el.classList.remove('dimmed'));
      filterHint.classList.remove('visible');
      resetHL();
    } else {
      activeFilter = key;
      document.querySelectorAll('.legend-item').forEach(el => {
        el.classList.toggle('dimmed', el.dataset.theme !== key);
      });
      filterHint.classList.add('visible');
      const m = new Set(allNodes.filter(n => n.themes.includes(key)).map(n => n.id));
      node.selectAll('circle, rect').transition().duration(300)
        .attr('fill-opacity', n => m.has(n.id) ? 0.9 : 0.06)
        .attr('stroke-opacity', n => m.has(n.id) ? 0.5 : 0.015);
      node.selectAll('text').transition().duration(300)
        .attr('fill-opacity', n => m.has(n.id) ? 0.9 : 0.04);
      link.transition().duration(300)
        .attr('stroke-opacity', l => {
          const s = typeof l.source === 'object' ? l.source.id : l.source;
          const t = typeof l.target === 'object' ? l.target.id : l.target;
          return (m.has(s) && m.has(t)) ? 0.3 : 0.005;
        });
    }
  });
  legendEl.appendChild(item);
}

// ═══════════════════════════════════════════════
// Tick
// ═══════════════════════════════════════════════
simulation.on('tick', () => {
  link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  node.attr('transform', d => `translate(${d.x},${d.y})`);
});

function ds(e, d) { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dd(e, d) { d.fx = e.x; d.fy = e.y; }
function de(e, d) { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  svg.attr('viewBox', [0, 0, w, h]);
  simulation.force('center', d3.forceCenter(w / 2, h / 2).strength(0.01));
  simulation.force('x', d3.forceX(d => d.kind === 'paper' ? w * 0.55 / 2 : w * 1.45 / 2).strength(BARRIER_STRENGTH));
  simulation.force('y', d3.forceY(h / 2).strength(0.025));
  simulation.alpha(0.3).restart();
});
</script>
</body>
</html>
