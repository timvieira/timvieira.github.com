# Canonical publication data for Tim Vieira
# -------------------------------------------------
# Title escaping convention (for BibTeX):
#   {Braces} around words that must preserve capitalization.
#   The build script strips braces for HTML/plaintext output and
#   passes them through verbatim for BibTeX \title{} fields.
#
# Fields:
#   id          - stable key, used as BibTeX cite key
#   title       - with {braces} for BibTeX capitalization protection
#   authors     - list of "First Last" names (natural order)
#   year        - publication year (integer)
#   venue       - short display name (e.g. "ACL 2023")
#   venue_full  - full proceedings name for BibTeX booktitle/journal
#   type        - bibtex entry type: inproceedings | article | misc | phdthesis
#   note        - optional note displayed after venue (awards, oral, spotlight, etc.)
#   themes      - list of topic tags (for research graph)
#   featured    - show on homepage (default: true for all)
#   equal_contribution - "*" authors marker (list of author indices, 0-based)
#   links:
#     url       - primary link (required)
#     arXiv     - arXiv URL
#     code      - code repository
#     slides    - slides link
#     video     - video link
#     poster    - poster link
#     openreview - OpenReview link
#     data      - dataset link
#     other     - list of {label, url} for miscellaneous links
#   bibtex:     - extra BibTeX-only fields (doi, pages, volume, isbn, etc.)
# -------------------------------------------------

